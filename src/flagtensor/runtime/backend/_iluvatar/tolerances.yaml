# Vendor-specific tolerances for Iluvatar CoreX (BI-V150).
#
# These values are the *benchmark-verify floor*: when the benchmark harness
# compares the Triton kernel output against the baseline output, the
# effective atol/rtol is max(dtype_default, floor). The dtype defaults
# come from DEFAULT_CORRECTNESS_TOLERANCES in
# src/flagtensor/testing/assertions.py (e.g. fp32 → 1.3e-6).
#
# Iluvatar uses a looser floor than NVIDIA (1e-4) because the Iluvatar
# baseline (PyTorch-native ops dispatched to the CoreX vendor libraries)
# does not share the GEMM implementation with the Triton kernel, so
# accumulated FP rounding from different tiling/summation orders shows up
# in the comparison. Measured on BI-V150 (fp32, largest benchmark shapes):
#   * Contraction         (512x256 @ 256x512):          max_abs ≈ 7.6e-6, max_rel ≈ 2.3e-4
#   * ContractionTrinary  (512x256 @ 256x384 @ 384x512): max_abs ≈ 2.4e-4, max_rel ≈ 1.5e-5
# The 1e-3 floor gives ~4x headroom over the worst observed difference
# while remaining tight enough to catch gross regressions (wrong dtype,
# off-by-factor, NaN/Inf). Unlike PPU, no contraction-family per-op
# override is needed on Iluvatar.
#
# The accuracy tests in tests/ still enforce the strict per-dtype tolerance
# (1.3e-6 for fp32); this floor only relaxes the *benchmark* verify path.

benchmark_verify_floor:
  atol: 1.0e-3
  rtol: 1.0e-3
