# Vendor-specific tolerances for Hygon DCU.
#
# These values are the *benchmark-verify floor*: when the benchmark harness
# compares the Triton kernel output against the baseline output, the
# effective atol/rtol is max(dtype_default, floor). The dtype defaults
# come from DEFAULT_CORRECTNESS_TOLERANCES in
# src/flagtensor/testing/assertions.py (e.g. fp32 -> 1.3e-6).
#
# Hygon uses a looser floor than NVIDIA (1e-4) because the Hygon baseline
# (PyTorch-native ops dispatched to the DCU vendor libraries via the
# torch_hcu hook) does not share the GEMM implementation with the Triton
# kernel, so accumulated FP rounding from different tiling / summation
# orders shows up in the comparison. The 1e-3 floor gives ample headroom
# over observed differences while remaining tight enough to catch gross
# regressions (wrong dtype, off-by-factor, NaN/Inf).
#
# The accuracy tests in tests/ still enforce the strict per-dtype tolerance
# (1.3e-6 for fp32); this floor only relaxes the *benchmark* verify path.

benchmark_verify_floor:
  atol: 1.0e-3
  rtol: 1.0e-3
