# Vendor-specific tolerances for NVIDIA GPUs (cuTensor baseline).
#
# These values are the *benchmark-verify floor*: when the benchmark harness
# compares the Triton kernel output against the cuTensor baseline output,
# the effective atol/rtol is max(dtype_default, floor). The dtype defaults
# come from DEFAULT_CORRECTNESS_TOLERANCES in
# src/flagtensor/testing/assertions.py (e.g. fp32 → 1.3e-6).
#
# NVIDIA keeps the historical 1e-4 floor because cuTensor and the Triton
# kernel share the same underlying GEMM conventions on NVIDIA hardware,
# so accumulated rounding differences stay well below 1e-4 on near-zero
# outputs even for large-K contractions.
#
# The accuracy tests in tests/ still enforce the strict per-dtype tolerance
# (1.3e-6 for fp32); this floor only relaxes the *benchmark* verify path,
# which only needs to catch gross correctness regressions (wrong dtype,
# off-by-factor, NaN/Inf).

benchmark_verify_floor:
  atol: 1.0e-4
  rtol: 1.0e-4
