name: flagtensor-weekly

on:
  workflow_dispatch:

jobs:
  full-ci:
    runs-on: h20
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e .
      - name: FlagTensor CI (full)
        run: |
          python tools/run_flagtensor_ci.py --op-list tools/ci_op_list.txt
