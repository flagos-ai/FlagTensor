name: flagtensor-weekly

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      op_list:
        description: "Path to operator list file (optional, generated from registry if empty)"
        required: false
        default: ""
      gpus:
        description: "GPU ids passed to weekly runner"
        required: false
        default: "0"
      mode:
        description: "Benchmark mode passed to weekly benchmark runs"
        required: false
        default: "kernel"

jobs:
  full-ci:
    runs-on: h20
    steps:
      - uses: actions/checkout@v4
      - name: Install package
        run: |
          export PATH=$HOME/.pyenv/bin:$PATH
          eval $(pyenv init - bash)
          uv venv
          source .venv/bin/activate
          uv pip install -e .
      - name: Prepare weekly operator list
        run: |
          python - <<'PY'
import sys
sys.path.insert(0, 'src')
from pathlib import Path
from flagtensor_registry import load_operator_registry

ops = [
    spec.name for spec in load_operator_registry()
    if spec.is_active and not spec.is_blocked
]
Path('ci_weekly_ops.txt').write_text('\n'.join(ops) + '\n', encoding='utf-8')
PY
      - name: Run weekly runner
        run: |
          python tools/run_flagtensor_weekly.py --project-root . --op-list ci_weekly_ops.txt --gpus "${{ github.event.inputs.gpus || '0' }}" --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir weekly_results_ci
      - name: Upload weekly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-weekly-results
          path: |
            ci_weekly_ops.txt
            weekly_results_ci
            pyproject.toml
