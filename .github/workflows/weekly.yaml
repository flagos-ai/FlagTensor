name: FlagTensor Weekly

on:
  schedule:
    - cron: "0 2 * * 0"   # every Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      ops:
        description: "Operator names (empty = all stable)"
        required: false
        default: ""
      gpus:
        description: "GPU IDs"
        required: false
        default: "0,1"

permissions:
  contents: read

jobs:
  weekly:
    runs-on: [self-hosted, linux, x86_64, nvidia, a100]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: bash setup.sh
      - name: Full test
        run: |
          python3 tools/run_tests.py \
            --stages stable \
            --ops "${{ github.event.inputs.ops || '' }}" \
            --gpus "${{ github.event.inputs.gpus || '0,1' }}" \
            --output-dir results
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-weekly-results
          path: results/
