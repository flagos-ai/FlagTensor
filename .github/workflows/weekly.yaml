name: flagtensor-weekly

on:
  workflow_dispatch:
    inputs:
      op_list:
        description: "Path to operator list file"
        required: false
        default: "weekly_op_test.txt"
      gpus:
        description: "GPU ids passed to weekly runner"
        required: false
        default: "0"
      mode:
        description: "Benchmark mode passed to weekly benchmark runs"
        required: false
        default: "kernel"

jobs:
  weekly-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Prepare weekly operator list
        run: |
          if [ -f "${{ github.event.inputs.op_list || 'weekly_op_test.txt' }}" ]; then
            cp "${{ github.event.inputs.op_list || 'weekly_op_test.txt' }}" ci_weekly_ops.txt
          else
            python - <<'PY'
import sys
sys.path.insert(0, 'src')
from pathlib import Path
from flagtensor_registry import load_operator_registry

ops = [
    spec.name for spec in load_operator_registry()
    if spec.is_active and not spec.is_blocked
]
Path('ci_weekly_ops.txt').write_text('\n'.join(ops) + '\n', encoding='utf-8')
PY
          fi
      - name: Run weekly runner
        run: |
          python tools/run_flagtensor_weekly.py --project-root . --op-list ci_weekly_ops.txt --gpus "${{ github.event.inputs.gpus || '0' }}" --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir weekly_results_ci
      - name: Upload weekly artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-weekly-results
          path: |
            ci_weekly_ops.txt
            weekly_results_ci
            pyproject.toml
