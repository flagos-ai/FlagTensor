name: FlagTensor Compatibility

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: [self-hosted, linux, x86_64, nvidia, a100]
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: bash setup.sh
      - name: Compatibility test
        run: |
          python3 tools/run_tests.py \
            --stages stable \
            --gpus 0 \
            --output-dir results
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-compat-results
          path: results/
