name: flagtensor-compatibility

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      category:
        description: "Operator categories (unary/binary/contraction/sparse)"
        required: false
        default: "unary"

jobs:
  compatibility:
    name: "CUDA ${{ matrix.cuda }} correctness"
    runs-on: [self-hosted, a100]
    strategy:
      fail-fast: false
      matrix:
        cuda: ["12.1", "12.4", "12.6"]
    container:
      image: "nvidia/cuda:${{ matrix.cuda }}-devel-ubuntu22.04"
      options: --gpus all
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-pip git

      - name: Install PyTorch (CUDA ${{ matrix.cuda }})
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cu${{ matrix.cuda }}

      - name: Install cutensor
        run: |
          python3 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple cutensor-cu12
          ln -sf $(python3 -c "import cutensor; print(cutensor.__path__[0])")/lib/libcutensor.so.2 /usr/lib/x86_64-linux-gnu/libcutensor.so

      - name: Install flagtree
        run: |
          python3 -m pip install --no-cache-dir \
            --index-url=https://resource.flagos.net/repository/flagos-pypi-hosted/simple \
            --trusted-host=resource.flagos.net \
            "flagtree==0.4.0+3.3" --no-deps

      - name: Install flagtensor
        run: |
          python3 -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple PyYAML
          python3 -m pip install -e .

      - name: Run smoke correctness
        run: |
          python3 tools/run_tests.py \
            --category "${{ github.event.inputs.category || 'unary' }}" \
            --gpus 0 \
            --results-dir compatibility_results

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-compat-cu${{ matrix.cuda }}
          path: compatibility_results
