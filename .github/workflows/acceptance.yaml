name: FlagTensor Acceptance

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      stages:
        description: "Operator stages (stable, all)"
        required: false
        default: "stable"
      gpus:
        description: "GPU IDs"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: [self-hosted, linux, x86_64, nvidia, a100]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: bash setup.sh
      - name: Acceptance test
        run: |
          python3 tools/run_tests.py \
            --stages "${{ github.event.inputs.stages || 'stable' }}" \
            --gpus "${{ github.event.inputs.gpus || '0' }}" \
            --output-dir results \
            --dump-output
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-acceptance-results
          path: results/
