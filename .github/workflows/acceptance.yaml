name: flagtensor-acceptance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode (kernel/operator/wrapper)"
        required: false
        default: "kernel"
      category:
        description: "Operator category to run (unary/binary/contraction/sparse, leave empty for all)"
        required: false
        default: ""
  schedule:
    - cron: "0 2 * * 0"

jobs:
  correctness-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . PyYAML
      - name: Run acceptance correctness CI
        run: |
          python tools/run_flagtensor_ci.py \
            --run-correctness \
            --mode "${{ github.event.inputs.mode || 'kernel' }}" \
            --category "${{ github.event.inputs.category || '' }}" \
            --results-dir acceptance_results_correctness \
            --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output acceptance_results_correctness/env.json || true
      - name: Generate acceptance summary
        run: |
          echo "# FlagTensor Acceptance Correctness Summary" > acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
          echo "" >> acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
          echo "**Mode:** ${{ github.event.inputs.mode || 'kernel' }}" >> acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
          echo "**Category:** ${{ github.event.inputs.category || 'all' }}" >> acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
          echo "" >> acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
          if [ -f acceptance_results_correctness/summary.json ]; then
            python - <<'PY' >> acceptance_results_correctness/ACCEPTANCE_SUMMARY.md
import json
from pathlib import Path

data = json.loads(Path('acceptance_results_correctness/summary.json').read_text())
correctness = data.get('correctness', {})
total = len(correctness)
passed = sum(1 for v in correctness.values() if v.get('status') == 'PASS')
failed = sum(1 for v in correctness.values() if v.get('status') != 'PASS')

print(f"## Results")
print(f"- Total: {total}")
print(f"- Passed: {passed}")
print(f"- Failed: {failed}")
print(f"- Pass Rate: {passed/total*100:.1f}%" if total else "Pass Rate: N/A")
print("")
print(f"### Failed Operators")
failed_ops = [op for op, info in correctness.items() if info.get('status') != 'PASS']
if failed_ops:
    for op in failed_ops:
        print(f"- {op}: {correctness[op].get('status')}")
else:
    print("None")
print("")
print(f"### All Operators")
print(f"| Operator | Status |")
print(f"| --- | --- |")
for op, info in correctness.items():
    status = info.get('status', 'UNKNOWN')
    emoji = "✅" if status == "PASS" else "❌"
    print(f"| {op} | {emoji} {status} |")
PY
          fi
      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-acceptance-correctness
          path: acceptance_results_correctness
      - name: Report summary
        run: |
          cat acceptance_results_correctness/ACCEPTANCE_SUMMARY.md >> $GITHUB_STEP_SUMMARY || true

  perf-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . PyYAML
      - name: Run acceptance perf CI
        run: |
          python tools/run_flagtensor_ci.py \
            --run-perf \
            --mode "${{ github.event.inputs.mode || 'kernel' }}" \
            --category "${{ github.event.inputs.category || '' }}" \
            --results-dir acceptance_results_perf \
            --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output acceptance_results_perf/env.json || true
      - name: Generate acceptance summary
        run: |
          echo "# FlagTensor Acceptance Performance Summary" > acceptance_results_perf/ACCEPTANCE_SUMMARY.md
          echo "" >> acceptance_results_perf/ACCEPTANCE_SUMMARY.md
          echo "**Mode:** ${{ github.event.inputs.mode || 'kernel' }}" >> acceptance_results_perf/ACCEPTANCE_SUMMARY.md
          echo "**Category:** ${{ github.event.inputs.category || 'all' }}" >> acceptance_results_perf/ACCEPTANCE_SUMMARY.md
          echo "" >> acceptance_results_perf/ACCEPTANCE_SUMMARY.md
          if [ -f acceptance_results_perf/summary.json ]; then
            python - <<'PY' >> acceptance_results_perf/ACCEPTANCE_SUMMARY.md
import json
from pathlib import Path

data = json.loads(Path('acceptance_results_perf/summary.json').read_text())
perf = data.get('performance', {})
total = len(perf)
passed = sum(1 for v in perf.values() if v.get('status') == 'PASS')
failed = sum(1 for v in perf.values() if v.get('status') != 'PASS')

print(f"## Results")
print(f"- Total: {total}")
print(f"- Passed: {passed}")
print(f"- Failed: {failed}")
print(f"- Pass Rate: {passed/total*100:.1f}%" if total else "Pass Rate: N/A")
print("")
print(f"### Speedup Statistics")
speedups = [v.get('avg_speedup') for v in perf.values() if v.get('avg_speedup') is not None]
if speedups:
    import statistics
    print(f"- Average Speedup: {statistics.mean(speedups):.4f}x")
    print(f"- Median Speedup: {statistics.median(speedups):.4f}x")
    print(f"- Max Speedup: {max(speedups):.4f}x")
    print(f"- Min Speedup: {min(speedups):.4f}x")
else:
    print("No speedup data available")
print("")
print(f"### Failed Operators")
failed_ops = [op for op, info in perf.items() if info.get('status') != 'PASS']
if failed_ops:
    for op in failed_ops:
        print(f"- {op}: {perf[op].get('status')}")
else:
    print("None")
print("")
print(f"### All Operators")
print(f"| Operator | Status | Avg Speedup | Max Speedup |")
print(f"| --- | --- | --- | --- |")
for op, info in perf.items():
    status = info.get('status', 'UNKNOWN')
    emoji = "✅" if status == "PASS" else "❌"
    avg = info.get('avg_speedup')
    max_sp = info.get('max_speedup')
    avg_str = f"{avg:.4f}" if avg is not None else "N/A"
    max_str = f"{max_sp:.4f}" if max_sp is not None else "N/A"
    print(f"| {op} | {emoji} {status} | {avg_str} | {max_str} |")
PY
          fi
      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-acceptance-perf
          path: acceptance_results_perf
      - name: Report summary
        run: |
          cat acceptance_results_perf/ACCEPTANCE_SUMMARY.md >> $GITHUB_STEP_SUMMARY || true
