name: flagtensor-ci

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode passed to the CI runner"
        required: false
        default: "kernel"

jobs:
  correctness-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . PyYAML
      - name: Run smoke correctness CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-correctness --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir ci_results_correctness --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_correctness/env.json || true
      - name: Generate summary report
        run: |
          echo "# FlagTensor Smoke Correctness Summary" > ci_results_correctness/GITHUB_STEP_SUMMARY.md
          echo "" >> ci_results_correctness/GITHUB_STEP_SUMMARY.md
          if [ -f ci_results_correctness/summary.json ]; then
            python - <<'PY'
import json
from pathlib import Path

data = json.loads(Path('ci_results_correctness/summary.json').read_text())
print(f"| Operator | Status |")
print(f"| --- | --- |")
for op, info in data.get('correctness', {}).items():
    status = info.get('status', 'UNKNOWN')
    emoji = "✅" if status == "PASS" else "❌"
    print(f"| {op} | {emoji} {status} |")
PY
            echo "" >> ci_results_correctness/GITHUB_STEP_SUMMARY.md
            python - <<'PY' >> ci_results_correctness/GITHUB_STEP_SUMMARY.md
import json
from pathlib import Path

data = json.loads(Path('ci_results_correctness/summary.json').read_text())
print(f"| Operator | Status |")
print(f"| --- | --- |")
for op, info in data.get('correctness', {}).items():
    status = info.get('status', 'UNKNOWN')
    emoji = "✅" if status == "PASS" else "❌"
    print(f"| {op} | {emoji} {status} |")
PY
          fi
      - name: Upload correctness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-correctness-smoke
          path: ci_results_correctness
      - name: Report summary
        run: |
          cat ci_results_correctness/GITHUB_STEP_SUMMARY.md >> $GITHUB_STEP_SUMMARY || true

  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . PyYAML
      - name: Run smoke perf CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-perf --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir ci_results_perf --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_perf/env.json || true
      - name: Generate summary report
        run: |
          echo "# FlagTensor Smoke Performance Summary" > ci_results_perf/GITHUB_STEP_SUMMARY.md
          echo "" >> ci_results_perf/GITHUB_STEP_SUMMARY.md
          if [ -f ci_results_perf/summary.json ]; then
            python - <<'PY' >> ci_results_perf/GITHUB_STEP_SUMMARY.md
import json
from pathlib import Path

data = json.loads(Path('ci_results_perf/summary.json').read_text())
print(f"| Operator | Status | Avg Speedup | Max Speedup |")
print(f"| --- | --- | --- | --- |")
for op, info in data.get('performance', {}).items():
    status = info.get('status', 'UNKNOWN')
    emoji = "✅" if status == "PASS" else "❌"
    avg = info.get('avg_speedup')
    max_sp = info.get('max_speedup')
    avg_str = f"{avg:.4f}" if avg is not None else "N/A"
    max_str = f"{max_sp:.4f}" if max_sp is not None else "N/A"
    print(f"| {op} | {emoji} {status} | {avg_str} | {max_str} |")
PY
          fi
      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-perf-smoke
          path: ci_results_perf
      - name: Report summary
        run: |
          cat ci_results_perf/GITHUB_STEP_SUMMARY.md >> $GITHUB_STEP_SUMMARY || true
