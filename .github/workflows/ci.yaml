name: FlagTensor CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ops:
        description: "Comma-separated operator names (empty = all stable)"
        required: false
        default: ""
      stages:
        description: "Operator stages (stable, all)"
        required: false
        default: "stable"
      gpus:
        description: "Comma-separated GPU IDs"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  correctness:
    runs-on: [self-hosted, linux, x86_64, nvidia, a100]
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
      - if: failure()
        run: sleep 30s
      - if: failure()
        uses: actions/checkout@v4
        continue-on-error: true
      - if: failure()
        run: sleep 30s
      - if: failure()
        uses: actions/checkout@v4
      - name: Setup
        run: bash setup.sh
      - name: Correctness
        run: |
          python3 tools/run_tests.py \
            --stages "${{ github.event.inputs.stages || 'stable' }}" \
            --ops "${{ github.event.inputs.ops || '' }}" \
            --gpus "${{ github.event.inputs.gpus || '0' }}" \
            --output-dir results
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-results
          path: results/
