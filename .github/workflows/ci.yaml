name: flagtensor-ci

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode passed to the CI runner"
        required: false
        default: "kernel"

jobs:
  correctness-smoke:
    runs-on: [self-hosted, a100]
    steps:
      - uses: actions/checkout@v4
      - name: Verify GPU
        run: |
          echo "GPU Info:"
          nvidia-smi
      - name: Install cuTensor
        run: |
          apt-get update -qq
          apt-get install -y -qq cutensor-cuda-12 2>/dev/null || \
            echo "cuTensor installed via system packages"
      - name: Install flagtree
        run: |
          python3 -m pip install --no-cache-dir \
            --index-url=https://resource.flagos.net/repository/flagos-pypi-hosted/simple \
            --trusted-host=resource.flagos.net \
            "flagtree==0.5.0+aipu3.3" --no-deps 2>&1
      - name: Setup triton backends
        run: |
          mv /usr/local/lib/python3.10/dist-packages/triton/backends/aipu \
             /usr/local/lib/python3.10/dist-packages/triton/backends/aipu.disabled 2>/dev/null || true
      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . PyYAML
      - name: Run smoke correctness CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-correctness \
            --mode "${{ github.event.inputs.mode || 'kernel' }}" \
            --results-dir ci_results_correctness --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_correctness/env.json || true
      - name: Upload correctness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-correctness
          path: ci_results_correctness

  perf-smoke:
    runs-on: [self-hosted, a100]
    steps:
      - uses: actions/checkout@v4
      - name: Verify GPU
        run: |
          echo "GPU Info:"
          nvidia-smi
      - name: Install cuTensor
        run: |
          apt-get update -qq
          apt-get install -y -qq cutensor-cuda-12 2>/dev/null || true
      - name: Install flagtree
        run: |
          python3 -m pip install --no-cache-dir \
            --index-url=https://resource.flagos.net/repository/flagos-pypi-hosted/simple \
            --trusted-host=resource.flagos.net \
            "flagtree==0.5.0+aipu3.3" --no-deps 2>&1
      - name: Setup triton backends
        run: |
          mv /usr/local/lib/python3.10/dist-packages/triton/backends/aipu \
             /usr/local/lib/python3.10/dist-packages/triton/backends/aipu.disabled 2>/dev/null || true
      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . PyYAML
      - name: Run smoke perf CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-perf \
            --mode "${{ github.event.inputs.mode || 'kernel' }}" \
            --results-dir ci_results_perf --dump-json-summary
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_perf/env.json || true
      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-perf
          path: ci_results_perf
