name: flagtensor-ci

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark mode passed to the CI runner"
        required: false
        default: "kernel"

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_correctness/env.json
      - name: Run smoke correctness CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-correctness --exclude-op tensor_contraction_trinary --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir ci_results_correctness
      - name: Upload correctness artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-correctness
          path: ci_results_correctness

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Export environment
        run: |
          python tools/export_env.py --project-root . --output ci_results_perf/env.json
      - name: Run smoke perf CI
        run: |
          python tools/run_flagtensor_ci.py --smoke --run-perf --exclude-op tensor_contraction_trinary --mode "${{ github.event.inputs.mode || 'kernel' }}" --results-dir ci_results_perf
      - name: Upload perf artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flagtensor-ci-perf
          path: ci_results_perf
